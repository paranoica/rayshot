name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build in Debian 12
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e CARGO_HOME=/tmp/cargo -v "$PWD:/src" -w /src \
            rust:bookworm cargo build --release --locked

      - name: Package
        run: |
          name="rayshot-${GITHUB_REF_NAME}-x86_64-linux"
          mkdir -p "dist/$name"
          cp target/release/rayshot "dist/$name/"
          cp README.md README.ru.md LICENSE "dist/$name/"
          mkdir -p "dist/$name/gnome-extension"
          cp -r gnome-extension/rayshot@paranoica gnome-extension/install.sh \
            gnome-extension/uninstall.sh "dist/$name/gnome-extension/"
          tar -C dist -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rayshot-*.tar.gz
            rayshot-*.tar.gz.sha256
