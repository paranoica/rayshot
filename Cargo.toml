[package]
name = "rayshot"
version = "0.4.2"
edition = "2024"
rust-version = "1.92"
description = "Fast screenshot and annotation tool for Linux (GNOME/Wayland)"
license = "MIT"

[dependencies]
anyhow = "1.0.102"
ashpd = { version = "0.13.11", features = ["file_chooser", "screenshot", "tokio"] }
egui = "0.34.3"
egui-phosphor = "0.12.0"
egui-wgpu = "0.34.3"
egui-winit = { version = "0.34.3", default-features = false, features = ["clipboard", "links", "wayland", "x11"] }
image = "0.25.10"
libc = "0.2.186"
signal-hook = "0.4.4"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
url = "2.5.8"
wgpu = "29"
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
